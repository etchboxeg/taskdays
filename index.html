<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مخطط الأعمال">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مخطط الأسبوع والفواتير</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#F3F5F8;--surface:#fff;--ink:#0F1F2E;--muted:#66788A;--line:#E2E8EF;--brand:#0E7C78;--brand-soft:#E3F3F1;--brand-ink:#fff;--buy:#C2412D;--sell:#12804F;--side:#0F2A3D;--side-ink:#C9D6E2;--shadow:0 1px 2px rgba(15,31,46,.06),0 4px 14px rgba(15,31,46,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B141C;--surface:#121E28;--ink:#E7EEF4;--muted:#8DA1B2;--line:#223240;--brand:#3CC2BA;--brand-soft:#15302F;--brand-ink:#062321;--buy:#EE8D7B;--sell:#5CCB91;--side:#08101A;--side-ink:#9FB2C3;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B141C;--surface:#121E28;--ink:#E7EEF4;--muted:#8DA1B2;--line:#223240;--brand:#3CC2BA;--brand-soft:#15302F;--brand-ink:#062321;--buy:#EE8D7B;--sell:#5CCB91;--side:#08101A;--side-ink:#9FB2C3;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6;font-size:15px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:center;gap:12px;padding:0 6px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.logo b{display:block;color:#fff;font-size:1rem;line-height:1.3}.logo small{font-size:.78rem;opacity:.75}
#tabs{display:flex;flex-direction:column;gap:4px}
#tabs button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink);padding:11px 12px;border-radius:10px;cursor:pointer;text-align:start}
#tabs button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button:hover{background:rgba(255,255,255,.07)}
#tabs button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff;font-weight:700;box-shadow:inset -3px 0 0 var(--brand)}
.side .note{margin-top:auto;font-size:.76rem;opacity:.65;padding:0 6px}
.main{padding:28px 32px;max-width:1180px;width:100%}
.top{margin-bottom:20px}
h1{font-size:1.65rem;margin:0;line-height:1.3}
.hint{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:8px 14px}
.btn.ghost:hover{background:var(--brand-soft)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);color:var(--muted);font-size:.85rem}
.sum b{display:block;font-size:1.5rem;color:var(--ink);line-height:1.4;margin-top:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.bar .nav{display:flex;gap:6px}
.prog{flex:1;min-width:200px;max-width:360px}
.prog .t{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .t i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.prog small{color:var(--muted);font-size:.8rem}
form.add{display:flex;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px;box-shadow:var(--shadow)}
form.add>*{flex:1 1 150px;min-width:0}
form.add button{flex:0 0 auto}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input:focus,select:focus{border-color:var(--brand)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 0 8px;min-height:170px;box-shadow:var(--shadow);overflow:hidden}
.day h3{margin:0;padding:10px 12px;font-size:.92rem;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day h3 span{color:var(--muted);font-weight:400;font-size:.76rem}
.day.today h3{background:var(--brand);color:var(--brand-ink)}.day.today h3 span{color:inherit;opacity:.85}
.day>.empty,.day>.task{margin:0 10px}
.task{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.task:last-child{border-bottom:0}
.task input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--brand);padding:0}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .pj{display:inline-block;margin-top:2px;padding:0 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);font-size:.72rem}
.task>div{flex:1;min-width:0}.rq{display:block;margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--bg);border:1px dashed var(--line);color:var(--muted);font-size:.78rem;cursor:pointer;white-space:pre-wrap}.rq.add{background:none;border:0;padding:2px 0;opacity:.7}.x{margin-inline-start:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;border-radius:6px;padding:0 5px}
.x:hover{color:var(--buy);background:var(--bg)}
.empty{color:var(--muted);font-size:.84rem;padding:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.row span{color:var(--muted)}
.buy{color:var(--buy)}.sell{color:var(--sell)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}.filters>*{flex:1 1 150px;min-width:0}.filters label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}.filters button{flex:0 0 auto}.count{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}.thumb[hidden]{display:none}.cam{display:flex;gap:8px;align-items:center;flex:1 1 150px}.cam[hidden]{display:none}.camb{display:flex;align-items:center;justify-content:center;gap:6px}.act{white-space:nowrap}.act .x{display:inline-flex;vertical-align:middle}.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}.lb img{max-width:100%;max-height:76vh;border-radius:10px}.lb div{display:flex;gap:8px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:660px}
th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:.8rem;background:var(--bg)}
tbody tr:hover{background:var(--brand-soft)}
tbody tr:last-child td{border-bottom:0}
.tag{padding:3px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
.tag.buy{background:rgba(194,65,45,.12)}.tag.sell{background:rgba(18,128,79,.12)}
@media (max-width:1000px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
 .shell{display:block}
 .side{position:fixed;inset:auto 0 0 0;top:auto;bottom:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;border-top:1px solid rgba(255,255,255,.1)}
 .logo,.side .note{display:none}
 #tabs{flex-direction:row;width:100%;gap:4px}
 #tabs button{flex:1;flex-direction:column;gap:2px;font-size:.75rem;padding:7px 4px;justify-content:center;align-items:center}
 #tabs button[aria-selected="true"]{box-shadow:none}
 .main{padding:18px 14px 96px}
 h1{font-size:1.35rem}
}
@media (max-width:560px){.week{grid-template-columns:1fr}.day{min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2 refinements */
:root{--pl:38%;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pl:68%}}
:root[data-theme="dark"]{--pl:68%}
body{background:radial-gradient(900px 320px at 100% -80px,var(--brand-soft),transparent 70%),var(--bg);background-attachment:fixed;letter-spacing:.005em}
.side{background:linear-gradient(185deg,var(--side) 0%,color-mix(in srgb,var(--side) 78%,#000) 100%)}
.mark{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#0a2a4a));box-shadow:0 6px 16px rgba(0,0,0,.28)}
#tabs button{transition:background .15s,color .15s}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
#theme{padding:9px 11px;display:grid;place-items:center;border-radius:12px}
#theme svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{border-radius:11px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn.ghost{box-shadow:none}
input:focus,select:focus{box-shadow:0 0 0 3px var(--brand-soft)}
.sum div{border-radius:16px;border-inline-start:4px solid var(--a,var(--brand));padding:16px 18px}
.sum div:nth-child(2){--a:var(--sell)}
.sum div:nth-child(3){--a:#D79A1E}
.sum div:nth-child(4){--a:var(--brand)}
.sum.inv div:nth-child(1){--a:var(--buy)}
.sum.inv div:nth-child(2){--a:var(--sell)}
.sum.inv div:nth-child(3){--a:var(--brand)}
.sum b{font-size:1.65rem;font-weight:700}
.prog .t{height:10px}
.prog .t i{background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 60%,#7be0c0))}
.day{border-radius:16px;padding-bottom:10px}
.day h3{padding:12px;font-size:.95rem}
.day.today{border:1px solid var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}
.day>.task{margin:8px 8px 0}
.task{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 10px;transition:opacity .2s}
.task:last-child{border-bottom:1px solid var(--line)}
.task[data-p]{border-inline-start:4px solid hsl(var(--h) 60% var(--pl))}
.task.done{opacity:.6}
.task .pj{background:color-mix(in srgb,hsl(var(--h,210) 60% var(--pl)) 15%,transparent);color:hsl(var(--h,210) 60% var(--pl));font-weight:500}
.card{border-radius:16px;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 8px 24px rgba(15,31,46,.1);transform:translateY(-2px)}
.card h3 span{display:flex;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 60% var(--pl));display:inline-block;margin-inline-end:10px;flex:none}
.mini{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 10px}
.mini i{display:block;height:100%;border-radius:6px;background:hsl(var(--h) 60% var(--pl))}
.tablebox{border-radius:16px}
th{padding:13px 16px}
.tag{display:inline-flex;align-items:center;gap:6px}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
p.empty{text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:16px;background:var(--surface);font-size:.95rem}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:500;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@media (max-width:820px){.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}h1{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}.toast{animation:none}}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;font:inherit;resize:vertical;min-height:72px}textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cobtn{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;cursor:pointer;font:inherit;color:inherit}
.cn{display:flex;align-items:center;font-weight:700;font-size:1.05rem}
.cdet{margin-bottom:14px}
.vis{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;border-inline-start:4px solid var(--brand);box-shadow:var(--shadow)}
.vis.m{border-inline-start-color:#D79A1E}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.vh>span{display:flex;align-items:center;gap:6px}
.vw{white-space:pre-wrap}
.tag.k-visit{background:var(--brand-soft);color:var(--brand)}
.tag.k-fix{background:rgba(215,154,30,.18);color:#B07D12}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools .btn.ghost{padding:8px 12px;font-size:.85rem}#theme{padding:8px 10px}.sy{font-size:.8rem;color:var(--muted)}.sy.ok{color:var(--sell)}.sy.err{color:var(--buy)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo"><span class="mark">م</span><div><b>مخطط الأعمال</b><small>المهام والمشاريع والفواتير</small></div></div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-t="week" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>الأسبوع</span></button>
      <button role="tab" data-t="projects" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>المشاريع</span></button>
      <button role="tab" data-t="companies" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/><path d="M14 10h5a1 1 0 0 1 1 1v10"/><path d="M8 8h2M8 12h2M8 16h2M3 21h18"/></svg><span>الشركات</span></button>
      <button role="tab" data-t="invoices" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>الفواتير</span></button>
    </nav>
    <p class="note">البيانات محفوظة في متصفحك على هذا الجهاز فقط.</p>
  </aside>
  <main class="main">
    <div class="top"><div><h1 id="pt"></h1><p class="hint" id="ps"></p></div><div class="tools"><span id="sy" class="sy" role="status"></span><button id="bk" class="btn ghost" type="button">نسخة احتياطية</button><button id="rs" class="btn ghost" type="button">استعادة</button><button id="theme" class="btn ghost" type="button" aria-label="تبديل الوضع الداكن"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button></div></div>
    <div id="app"></div>
  </main>
</div>
<script>
(function(){
var KEY="planner-v1", S={projects:[],tasks:[],invoices:[]}, tab="week", off=0;
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.tasks)S=p}}catch(e){}
S.companies=S.companies||[];S.visits=S.visits||[];
var CO="";
var PI="",RID="",CAM='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function save(rm){if(!rm)S._u=Date.now();var ok=false;try{localStorage.setItem(KEY,JSON.stringify(S));ok=true}catch(e){alert("مساحة التخزين ممتلئة، لم تُحفظ آخر تغييرات. احذف بعض صور الفواتير ثم أعد المحاولة.")}if(!rm&&SYNC.db){pushMain();syncImgs()}return ok}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hue(id){if(!id)return 210;var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h}
function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function money(n){return Number(n||0).toLocaleString("ar-EG",{maximumFractionDigits:2})+" ج.م"}
var DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function weekStart(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7)+off*7);return d}
function days(){var s=weekStart(),a=[];for(var i=0;i<7;i++){var d=new Date(s);d.setDate(s.getDate()+i);a.push(d)}return a}
function pname(id){for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===id)return S.projects[i].name;return ""}
function popts(sel,none){return '<option value="">'+none+'</option>'+S.projects.map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?" selected":"")+'>'+esc(p.name)+'</option>'}).join("")}
function fmt(d){return d.toLocaleDateString("ar-EG",{day:"numeric",month:"long"})}

function renderWeek(){
  var ds=days(),keys=ds.map(iso),today=iso(new Date());
  var wt=S.tasks.filter(function(t){return keys.indexOf(t.date)>-1});
  var done=wt.filter(function(t){return t.done}).length;
  var pct=wt.length?Math.round(done/wt.length*100):0;
  var N=function(n){return n.toLocaleString("ar-EG")};var h='<div class="sum"><div>مهام الأسبوع<b>'+N(wt.length)+'</b></div><div>منجزة<b class="sell">'+N(done)+'</b></div><div>متبقية<b>'+N(wt.length-done)+'</b></div><div>نسبة الإنجاز<b>'+N(pct)+'٪</b></div></div><div class="bar"><div class="nav"><button class="btn ghost" data-a="prev">الأسبوع السابق</button><button class="btn ghost" data-a="now">هذا الأسبوع</button><button class="btn ghost" data-a="next">الأسبوع التالي</button></div>'
   +'<div class="prog"><div class="t"><i style="width:'+pct+'%"></i></div><small>تم إنجاز '+done.toLocaleString("ar-EG")+' من '+wt.length.toLocaleString("ar-EG")+' مهمة</small></div></div>'
   +'<form class="add" id="tf"><input name="title" required placeholder="مهمة جديدة" aria-label="المهمة"><input name="req" placeholder="المتطلبات (اختياري)" aria-label="المتطلبات">'
   +'<select name="date" aria-label="اليوم">'+ds.map(function(d,i){return '<option value="'+keys[i]+'"'+(keys[i]===today?" selected":"")+'>'+DN[d.getDay()]+" "+fmt(d)+'</option>'}).join("")+'</select>'

  SYNC.imgs={};(r.invoices||[]).forEach(function(v){if(v.hasImg)SYNC.imgs[v.id]=1});

  else if((r._u||0)>lu){["projects","tasks","companies","visits","invoices"].forEach(function(k){S[k]=(r[k]||[]).slice()});S._u=r._u}
  else{setSync("ok");return}
  S.invoices.forEach(function(v){var need=v.hasImg&&!v.img;delete v.hasImg;if(!v.img&&im[v.id])v.img=im[v.id];
    if(!v.img&&need){SYNC.pend[v.id]=1;SYNC.db.doc(sbase()+"img_"+v.id).get().then(function(sn){delete SYNC.pend[v.id];var d=sn.exists&&sn.data();if(d&&d.d){v.img=d.d;save(true);safeRender()}}).catch(function(){delete SYNC.pend[v.id]})}});
  save(true);if(push){pushMain();syncImgs()}setSync("ok");safeRender();
}
if(window.claude&&claude.use){Promise.all([claude.use("db"),claude.use("user")]).then(function(a){var db=a[0],u=a[1];if(!db||!u)return;return u.id().then(function(id){if(!id)return;SYNC.db=db;SYNC.uid=id;setSync("sync");db.doc(sbase()+"main").onSnapshot(onRemote,function(){setSync("err")})})}).catch(function(){setSync("err")})}
function exportData(){var blob=new Blob([JSON.stringify({app:"planner",v:1,at:new Date().toISOString(),projects:S.projects,tasks:S.tasks,invoices:S.invoices,companies:S.companies,visits:S.visits})],{type:"application/json"}),fn="planner-backup-"+iso(new Date())+".json";
  var dl=window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null);
  dl.then(function(d){if(d)return d.save({filename:fn,data:blob}).then(function(){toast("تم حفظ النسخة الاحتياطية")});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();toast("تم تنزيل النسخة الاحتياطية")}).catch(function(){})}
var bkin=document.createElement("input");bkin.type="file";bkin.accept=".json,application/json";bkin.hidden=true;document.body.appendChild(bkin);
bkin.addEventListener("change",function(){var f=bkin.files[0];bkin.value="";if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||o.app!=="planner"||!Array.isArray(o.tasks))throw 0;if(!confirm("سيتم دمج بيانات الملف مع بياناتك الحالية دون حذف أي شيء. متابعة؟"))return;["projects","tasks","invoices","companies","visits"].forEach(function(k){S[k]=union(S[k],o[k])});save();render();toast("تمت استعادة البيانات")}catch(e){alert("الملف غير صالح. اختر ملف نسخة احتياطية من هذا التطبيق.")}};rd.readAsText(f)});
document.getElementById("bk").addEventListener("click",exportData);
document.getElementById("rs").addEventListener("click",function(){bkin.click()});

render();
})();
